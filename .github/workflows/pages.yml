name: Deploy GrindNotes mirror to GitHub Pages

# Publishes the static read-only mirror to the gh-pages branch. GitHub serves
# it at https://salinator513.github.io/Notes/ (Pages auto-enables from a
# gh-pages branch; the Actions token cannot create a Pages site directly).

on:
  push:
    branches: [claude/cursor-swing-physics-bstakk, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build static mirror
        run: node tools/build-site.mjs dist
      - name: Push to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy GrindNotes mirror (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
