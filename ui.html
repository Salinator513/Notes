<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrindNotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='4' fill='%23d97757'/%3E%3Cpath d='M4.5 5.5h7M4.5 8h7M4.5 10.5h4.5' stroke='%231f1e1c' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#262624; --side:#1f1e1c; --line:rgba(255,255,255,.07);
    --txt:#e8e6df; --mut:#98948a; --dim:#6e6a62;
    --hov:rgba(255,255,255,.05); --on:rgba(255,255,255,.09);
    --acc:#d97757; --acc2:#c4623f;
  }
  *{box-sizing:border-box;margin:0}
  ::selection{background:rgba(217,119,87,.35)}
  body{font:12.5px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;display:flex;height:100vh;background:var(--bg);color:var(--txt)}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
  ::-webkit-scrollbar-track{background:transparent}

  #side{width:225px;min-width:225px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  h1{font-size:12.5px;font-weight:600;color:var(--txt);padding:2px 8px 8px;letter-spacing:.01em}
  #newBtn{font:600 12px inherit;font-family:inherit;padding:7px 10px;margin:0 4px 8px;background:var(--acc);color:#fff;border:0;border-radius:8px;cursor:pointer;text-align:center;transition:background .12s}
  #newBtn:hover{background:var(--acc2)}
  .sec{margin-top:8px}
  .sec h2{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:2px 8px 5px;border-bottom:1px solid var(--line);margin:0 4px 3px}
  .item{position:relative;display:block;width:100%;text-align:left;border:0;background:none;padding:4px 20px 4px 8px;margin:1px 0;cursor:pointer;font:inherit;font-size:11.5px;color:var(--mut);border-radius:6px;user-select:none;transition:background .12s,color .12s}
  .item:hover{background:var(--hov);color:var(--txt)}
  .item.on{background:var(--on);color:var(--txt);font-weight:600;font-size:12.5px;padding-top:6px;padding-bottom:6px}
  .item small{display:none;color:var(--dim);font-weight:400;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item.on small{display:block}
  .item.drop{outline:1px dashed var(--acc);outline-offset:-1px}
  .item .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
  .del{position:absolute;right:3px;top:3px;display:none;border:0;background:none;color:var(--dim);font:12px/1 inherit;font-family:inherit;cursor:pointer;padding:2px 5px;border-radius:4px}
  .item:hover .del{display:block}
  .del:hover{color:#e06c5a;background:var(--hov)}
  .scrollList{max-height:86px;overflow-y:auto;overscroll-behavior:contain}
  .more{color:var(--dim);font-size:11px;padding:3px 8px;background:none;border:0;cursor:pointer;border-radius:6px;text-align:left;display:block;transition:background .12s,color .12s}
  .more:hover{color:var(--txt);background:var(--hov)}
  .stale{color:var(--dim)}

  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  #title{font-weight:600;font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
  #saved{font-size:10.5px;color:var(--dim);transition:color .3s}
  #saved.err{color:#e06c5a}
  #usageBtn{font:11.5px inherit;font-family:inherit;padding:5px 10px;background:none;color:var(--mut);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
  #usageBtn:hover{background:var(--hov);color:var(--txt)}
  #view{flex:1;overflow-y:auto;padding:14px 18px;white-space:pre-wrap;display:none;color:var(--txt)}
  #edit{flex:1;resize:none;border:0;outline:none;padding:14px 18px;font:12.5px/1.55 inherit;font-family:inherit;display:none;background:var(--bg);color:var(--txt);caret-color:var(--acc)}

  #pbar{display:flex;gap:8px;align-items:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:var(--side)}
  #ptarget,#pselect{font:11.5px inherit;font-family:inherit;padding:5px 8px;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
  #ptarget:focus,#pselect:hover{background:var(--hov);color:var(--txt)}
  #pbox{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;outline:none;padding:6px 10px;font:12px/1.5 inherit;font-family:inherit;background:var(--bg);color:var(--txt);caret-color:var(--acc);max-height:110px;transition:border-color .12s}
  #pbox:focus{border-color:rgba(217,119,87,.5)}
</style>
</head>
<body>
<div id="side">
  <h1>GrindNotes</h1>
  <button id="newBtn">+ New note</button>
  <div class="sec"><h2>Status</h2><div id="statusList"></div></div>
  <div class="sec"><h2>Prompts</h2><div id="promptsList"></div></div>
  <div class="sec"><h2>Turn summaries</h2><div id="turnsList" class="scrollList"></div></div>
  <div class="sec"><h2>Scratchpad</h2><div id="scratchList"></div></div>
</div>
<div id="main">
  <div id="bar">
    <span id="title">–</span>
    <span id="saved"></span>
    <button id="usageBtn" onclick="window.open('/usage','usage','width=340,height=460')">Usage</button>
  </div>
  <div id="view"></div>
  <textarea id="edit" spellcheck="false"></textarea>
  <div id="pbar">
    <select id="ptarget">
      <option value="prompts/code.md">Code</option>
      <option value="prompts/codex.md">Codex</option>
    </select>
    <textarea id="pbox" rows="1" placeholder="Add to prompt… (Enter adds, Shift+Enter = new line)"></textarea>
    <button id="pselect">Select</button>
  </div>
</div>
<script src="/cursor.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let state = null, sel = null, selMtime = 0, editing = false, dirty = false, saveTimer = null;
let showAllScratch = false;
const COLLAPSE = 5;
const FRESH_MS = 24 * 3600 * 1000;
const PROMPTS = [
  { file: 'prompts/code.md',  label: 'Code prompt' },
  { file: 'prompts/codex.md', label: 'Codex prompt' },
];
const editable = (name) => name.startsWith('scratch/') || name.startsWith('prompts/');

function fmt(ms){ const d = new Date(ms); return isNaN(d) ? '' : d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

function renderLists(){
  const sl = $('statusList'); sl.innerHTML = '';
  const order = Object.keys(state.status).sort();
  for (const f of order){
    const b = document.createElement('div');
    b.className = 'item' + (sel === 'status/' + f ? ' on' : '');
    const label = f.replace(/^\d-|\.txt$/g,'').replace(/-/g,' ').toLowerCase();
    const n = document.createElement('span'); n.className = 'name';
    if (Date.now() - (state.status[f].mtime || 0) < FRESH_MS){
      const d = document.createElement('span'); d.className = 'dot'; n.appendChild(d);
    }
    n.appendChild(document.createTextNode(label));
    b.appendChild(n);
    b.onclick = () => open('status/' + f, label);
    sl.appendChild(b);
  }
  const pl = $('promptsList'); pl.innerHTML = '';
  for (const p of PROMPTS){
    const b = document.createElement('div');
    b.className = 'item' + (sel === p.file ? ' on' : '');
    const n = document.createElement('span'); n.className = 'name'; n.textContent = p.label;
    b.appendChild(n);
    b.onclick = () => open(p.file, p.label);
    b.addEventListener('dragover', (e) => { e.preventDefault(); b.classList.add('drop'); });
    b.addEventListener('dragleave', () => b.classList.remove('drop'));
    b.addEventListener('drop', async (e) => {
      e.preventDefault(); b.classList.remove('drop');
      const src = e.dataTransfer.getData('text/gn-file');
      if (!src) return;
      const r = await fetch('/api/file?name=' + encodeURIComponent(src)).then(r=>r.json());
      if (r.content != null){
        await fetch('/api/append', {method:'POST', body: JSON.stringify({name: p.file, content: '\n---\n' + r.content.trim()})});
        refresh();
      }
    });
    pl.appendChild(b);
  }
  fillList('turnsList', state.turns, { scroll: true });
  fillList('scratchList', state.scratch, { showAll: showAllScratch, setShow: v => { showAllScratch = v; }, deletable: true });
}
function fillList(id, arr, opts){
  const el = $(id); el.innerHTML = '';
  const shown = (opts.scroll || opts.showAll) ? arr : arr.slice(0, COLLAPSE);
  for (const t of shown){
    const b = document.createElement('div');
    b.className = 'item' + (sel === t.file ? ' on' : '');
    const n = document.createElement('span'); n.className = 'name'; n.textContent = t.title;
    const s = document.createElement('small'); s.textContent = fmt(t.mtime) + (t.preview ? ' · ' + t.preview : '');
    b.appendChild(n); b.appendChild(s);
    b.onclick = () => open(t.file, t.title);
    b.draggable = true;
    b.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/gn-file', t.file));
    if (opts.deletable){
      const x = document.createElement('button');
      x.className = 'del'; x.textContent = '✕'; x.title = 'Delete note';
      x.onclick = (e) => { e.stopPropagation(); del(t); };
      b.appendChild(x);
    }
    el.appendChild(b);
  }
  if (!opts.scroll && arr.length > COLLAPSE){
    const m = document.createElement('button');
    m.className = 'more';
    m.textContent = opts.showAll ? 'Show less' : `Show ${arr.length - COLLAPSE} more…`;
    m.onclick = () => { opts.setShow(!opts.showAll); renderLists(); };
    el.appendChild(m);
  }
  if (!arr.length){
    const d = document.createElement('div');
    d.className = 'item stale'; d.textContent = '(empty)';
    el.appendChild(d);
  }
}
async function del(t){
  if (!confirm('Delete "' + t.title + '"?')) return;
  await fetch('/api/delete', {method:'POST', body: JSON.stringify({name: t.file})});
  if (sel === t.file){
    sel = null; editing = false; dirty = false;
    $('title').textContent = '–'; $('view').textContent = '';
    $('view').style.display = 'block'; $('edit').style.display = 'none';
  }
  refresh();
}
async function open(name, label){
  if (dirty) await saveNow();
  let r;
  try { r = await fetch('/api/file?name=' + encodeURIComponent(name)).then(r=>r.json()); }
  catch { flash('server offline?', true); return; }
  if (r.error){ flash('missing: ' + name, true); refresh(); return; }
  sel = name; selMtime = r.mtime; editing = editable(name);
  const firstLine = (r.content || '').split('\n').find(l => l.trim());
  $('title').textContent = label || firstLine || name;
  $('view').style.display = editing ? 'none' : 'block';
  $('edit').style.display = editing ? 'block' : 'none';
  if (editing) $('edit').value = r.content; else $('view').textContent = r.content;
  renderLists();
}
function flash(msg, err){
  const s = $('saved');
  s.textContent = msg;
  s.classList.toggle('err', !!err);
}
async function saveNow(){
  if (!sel || !editing || !dirty) return;
  const name = sel, content = $('edit').value;
  try {
    const r = await fetch('/api/save', {method:'POST', body: JSON.stringify({name, content})}).then(r=>r.json());
    if (r.error) throw new Error(r.error);
    if (sel === name){
      if ($('edit').value === content) dirty = false;
      if (r.mtime) selMtime = r.mtime;
      flash('saved ' + new Date().toLocaleTimeString());
    }
  } catch {
    flash('save failed — retrying…', true);
    clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 2000);
  }
}
$('edit').addEventListener('input', () => {
  dirty = true; flash('…');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800);
});
$('edit').addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && (e.code === 'Digit8')) {
    e.preventDefault();
    const ta = e.target, v = ta.value;
    let s = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
    let en = v.indexOf('\n', ta.selectionEnd); if (en === -1) en = v.length;
    const block = v.slice(s, en);
    const lines = block.split('\n');
    const allBulleted = lines.every(l => l.startsWith('• '));
    const nb = lines.map(l => allBulleted ? l.slice(2) : (l.startsWith('• ') ? l : '• ' + l)).join('\n');
    ta.value = v.slice(0, s) + nb + v.slice(en);
    ta.selectionStart = s; ta.selectionEnd = s + nb.length;
    ta.dispatchEvent(new Event('input'));
  }
});
$('newBtn').onclick = async () => {
  await saveNow();
  const r = await fetch('/api/new', {method:'POST', body: JSON.stringify({})}).then(r=>r.json());
  await refresh();
  await open(r.file);
  const ta = $('edit'); ta.focus(); ta.setSelectionRange(0, ta.value.split('\n')[0].length);
};
// ---- prompt box ----
$('pbox').addEventListener('input', () => {
  const pb = $('pbox');
  pb.style.height = 'auto';
  pb.style.height = Math.min(pb.scrollHeight, 110) + 'px';
});
$('pbox').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const txt = $('pbox').value.trim();
    if (!txt) return;
    await fetch('/api/append', {method:'POST', body: JSON.stringify({name: $('ptarget').value, content: txt})});
    $('pbox').value = '';
    $('pbox').style.height = 'auto';
    refresh();
  }
});
$('pselect').onclick = () => {
  const f = $('ptarget').value;
  const p = PROMPTS.find(p => p.file === f);
  open(f, p && p.label);
};
async function refresh(){
  try { state = await fetch('/api/state').then(r=>r.json()); } catch { return; }
  renderLists();
  if (sel && !dirty){
    const entry = sel.startsWith('status/') ? state.status[sel.slice(7)]
      : [...(state.turns||[]), ...(state.scratch||[]), ...(state.prompts||[])].find(t => t.file === sel);
    const m = entry && (entry.mtime ?? 0);
    if (m && m > selMtime){
      const r = await fetch('/api/file?name=' + encodeURIComponent(sel)).then(r=>r.json());
      if (r.error) return;
      selMtime = r.mtime;
      if (editing) $('edit').value = r.content; else $('view').textContent = r.content;
    }
  }
}
window.addEventListener('beforeunload', () => {
  if (dirty && sel && editing){
    dirty = false;
    fetch('/api/save', {method:'POST', keepalive:true, body: JSON.stringify({name: sel, content: $('edit').value})});
  }
});
refresh().then(() => { if (state) open('status/2-CURRENT.txt', 'current'); });
setInterval(refresh, 1500);
</script>
</body>
</html>
