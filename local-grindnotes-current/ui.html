const $=(id)=>document.getElementById(id);let state=null,sel=null,selMtime=0,editing=false,dirty=false,saveTimer=null,showAllTurns=false,lastSig='',meta=null,metaDirty=false,press=null,drag=null,dropEl=null,contextOpen=false;let activeAssist=localStorage.getItem('grindnotes-assist')||'X';let responseStyle=null;const COLLAPSE=5;const ASSIST=[{file:'prompts/code.md',label:'C',key:'code',title:'Code'},{file:'prompts/cowork.md',label:'W',key:'cowork',title:'Cowork'},{file:'prompts/codex.md',label:'X',key:'codex',title:'Codex'}];const ICONS={code:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v17"/><path d="M5.2 6.8 18.8 17.2"/><path d="M18.8 6.8 5.2 17.2"/><path d="M3.8 12h16.4"/></svg>',cowork:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v17"/><path d="M5.2 6.8 18.8 17.2"/><path d="M18.8 6.8 5.2 17.2"/><path d="M3.8 12h16.4"/><circle cx="12" cy="12" r="2.1"/></svg>',codex:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 18.5h8.4a4.2 4.2 0 0 0 .5-8.3A6.1 6.1 0 0 0 5.7 12 3.4 3.4 0 0 0 8.2 18.5Z"/><path d="m9.1 11.3 2.2 2.2-2.2 2.2"/><path d="M13.4 15.7h3.2"/></svg>'};const RESPONSE_STYLES={short:{label:'Extremely short',text:'Please answer extremely short and concise.'},nitty:{label:'Nitty gritty',text:'Please include depth details and tool-use specifics.'},technical:{label:'Technicals',text:'Please focus on technical implementation details and how it worked.'},walk:{label:'Walk through',text:'Please walk through how you did everything step by step.'}};const META_FILE='scratch/.groups.json';const editable=(name)=>name.startsWith('scratch/')||name.startsWith('prompts/');const realScratch=(name)=>String(name||'').startsWith('scratch/')&&!String(name||'').includes('/.');function post(url,body){return fetch(url,{method:'POST',body:JSON.stringify(body||{})}).then(r=>r.json())}
function iconNode(key){const s=document.createElement('span');s.className='aiIcon '+key;s.innerHTML=ICONS[key]||ICONS.codex;return s}const assistByLabel=(label)=>ASSIST.find(x=>x.label===label)||ASSIST[2];const assistByFile=(file)=>ASSIST.find(x=>x.file===file)||ASSIST[2];const currentAssist=()=>assistByLabel(activeAssist);function renderTypeState(){const btn=$('railTypeBtn');if(btn)btn.classList.toggle('on',!!responseStyle);document.querySelectorAll('.typeOption').forEach(b=>b.classList.toggle('on',b.dataset.style===responseStyle))}function setResponseStyle(key){responseStyle=responseStyle===key?null:key;renderTypeState()}function promptPayload(raw){let payload=String(raw||'');const style=responseStyle&&RESPONSE_STYLES[responseStyle];if(style)payload=payload.replace(/[\r\n]*$/,'')+'\n\n[Response type: '+style.label+' - '+style.text+']';return payload}const pretty=(t)=>String(t||'').replace(/\.(md|txt)$/i,'').replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim().replace(/(^|\s)\p{L}/gu,m=>m.toUpperCase());const statusNames={'1-LAST-TURN.txt':'Completed','2-CURRENT.txt':'Current Summary','3-GOALS.txt':'Working Towards'};const statusLabel=(f)=>statusNames[f]||pretty(f.replace(/^\d-/,''));const chipOf=(file)=>{const m=String(file).match(/^turns\/([a-z-]+?)_/i);const s=m?m[1].toLowerCase():'';if(s==='cowork')return assistByLabel('W');if(s==='codex')return assistByLabel('X');if(s)return assistByLabel('C');return null};function shortTitle(t){let x=String(t||'').replace(/^(cowork|codex|claude[- ]?code|code|claude)\b[\s:_?-]*/i,'').replace(/\d{4}-\d{2}-\d{2}[\s:_-]*/g,'').replace(/^(session|turn)\b[\s:?-]*/i,'').replace(/\bgrindnotes?\b/ig,'').replace(/\bapp\b/ig,'').replace(/\s+/g,' ').trim();if(/^rebuilt\b/i.test(x))x='Rebuilt';return pretty(x)||'Untitled'}const stampId=()=> 'g'+Date.now()+Math.floor(Math.random()*1000);const basename=(file)=>String(file||'').split('/').pop()||'';const isAutoName=(t)=>/^\d{4}[-_]\d{2}[-_]\d{2}/.test(String(t||''))||/^untitled$/i.tes
